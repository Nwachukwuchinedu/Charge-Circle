services:
  - type: web
    name: charge-circle-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: charge-circle-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://charge-circle-backend.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://charge-circle-backend.onrender.com
